<!doctype html>
<html lang="en">
<head>
<title>Maestro · Arcade · Play</title>
<meta charset="utf-8"><meta name="viewport" content="width=1180, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>
/* Maestro · Arcade direction · design tokens
   Fonts (OFL-1.1, self-host later via npm):
     @fontsource-variable/unbounded  (display, numbers, CTA labels)
     @fontsource-variable/lexend     (UI + body; built for reading fluency)
*/
:root {
  /* ---- surfaces: "arcade night" ---- */
  --ink-0: #07061A;       /* deepest: keyboard well, overlays */
  --bg: #0E0C2A;          /* app background */
  --bg-2: #131036;        /* play-field background */
  --surface-1: #1A1744;   /* cards */
  --surface-2: #231F58;   /* raised cards, inputs */
  --surface-3: #2E2972;   /* hover / selected fill */
  --stroke: rgba(177, 166, 255, 0.14);
  --stroke-2: rgba(177, 166, 255, 0.28);
  --text: #F5F3FF;        /* 17.3:1 on --bg */
  --text-2: #C4BFEA;      /* 10.9:1 on --bg */
  --text-3: #938DCB;      /*  6.3:1 on --bg, 5.5:1 on --surface-1 */

  /* ---- brand ---- */
  --violet: #7B5CFF;
  --pink: #FF3FA4;
  --orange: #FF9A3D;
  --volt: #C8FF3D;        /* primary action. Always with --ink text (16.1:1) */
  --volt-2: #A9F02B;
  --volt-edge: #5B9A0C;   /* 3D button lip */
  --gold: #FFD23F;
  --mint: #3DF5B0;
  --sky: #4CC3FF;
  --coral: #FF5A6E;
  --ink: #0E0C2A;         /* text on bright fills */

  --grad-neon: linear-gradient(100deg, #7B5CFF 0%, #FF3FA4 52%, #FF9A3D 100%);
  --grad-volt: linear-gradient(180deg, #E2FF7A 0%, #C8FF3D 45%, #A9F02B 100%);
  --grad-card: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 40%);
  --grad-gold: linear-gradient(180deg, #FFE98A 0%, #FFD23F 50%, #F5A623 100%);

  /* ---- semantic: timing grades ---- */
  --perfect: #FFD23F;     /* gold + star icon   */
  --great: #3DF5B0;       /* mint               */
  --early: #A493FF;       /* cool = ahead       */
  --late: #FF9A3D;        /* warm = behind      */
  --miss: #FF5A6E;        /* coral, never pure red */

  /* ---- hands (falling notes, key hints) ---- */
  --rh: #35D6FF;          /* right hand: cyan  */
  --lh: #FF5FB7;          /* left hand: pink   */

  /* ---- stage colours (5 stages) ---- */
  --st-1: #3DF5B0;        /* Beginner      1-8   */
  --st-2: #4CC3FF;        /* Elementary    9-16  */
  --st-3: #A493FF;        /* Intermediate  17-26 */
  --st-4: #FF5FB7;        /* Advanced      27-34 */
  --st-5: #FFD23F;        /* Master        35-40 */

  /* ---- paper (sheet music) ---- */
  --paper: #FFF8EA;
  --paper-2: #F3E6CB;
  --paper-ink: #1B1733;
  --paper-line: #6A6384;
  --paper-muted: #7E7896;   /* bar numbers, fingering: 4.0:1 */
  /* grade colours for played noteheads on paper (all >= 4.4:1 on --paper) */
  --paper-perfect: #9A6A00;
  --paper-great: #0A8559;
  --paper-early: #5B45D6;
  --paper-late: #BF5510;
  --paper-miss: #C42A45;

  /* ---- type ---- */
  --font-display: 'Unbounded', 'Lexend', system-ui, sans-serif;
  --font-ui: 'Lexend', system-ui, -apple-system, sans-serif;

  /* ---- radii ---- */
  --r-xs: 8px;
  --r-s: 12px;
  --r-m: 18px;
  --r-l: 24px;
  --r-xl: 32px;
  --r-pill: 999px;

  /* ---- spacing (4-pt) ---- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

  /* ---- elevation ---- */
  --sh-card: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 18px 40px -12px rgba(3, 2, 18, 0.7);
  --sh-float: 0 24px 60px -16px rgba(3, 2, 18, 0.85);
  --sh-lip: 0 6px 0 #0A0822;                  /* chunky 3D lip for secondary buttons */
  --glow-volt: 0 0 0 1px rgba(200, 255, 61, 0.35), 0 10px 36px -6px rgba(200, 255, 61, 0.45);
  --glow-pink: 0 0 28px rgba(255, 63, 164, 0.55);
  --glow-gold: 0 0 26px rgba(255, 210, 63, 0.6);

  /* ---- motion ---- */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);        /* default UI */
  --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);     /* overshoot for rewards */
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);         /* exits */
  --t-tap: 90ms; --t-fast: 160ms; --t-base: 240ms; --t-slow: 420ms; --t-reward: 700ms;
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1180px; height: 820px; overflow: hidden; }
body {
  font-family: var(--font-ui);
  color: var(--text);
  background:
    radial-gradient(900px 520px at 6% -12%, rgba(123, 92, 255, 0.34), transparent 62%),
    radial-gradient(760px 520px at 108% 112%, rgba(255, 63, 164, 0.2), transparent 60%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  position: relative;
}
svg { display: block; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); letter-spacing: -0.01em; }
.label {
  font: 700 12px/16px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3);
}
.muted { color: var(--text-2); }
.grad-text { background: var(--grad-neon); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ico { width: 22px; height: 22px; flex: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 56px; padding: 0 26px; border-radius: var(--r-m); border: 0;
  font: 700 18px/1 var(--font-ui); color: var(--text); cursor: pointer; white-space: nowrap;
  background: var(--surface-2); box-shadow: var(--sh-lip), inset 0 0 0 1.5px var(--stroke-2);
  position: relative;
}
.btn .ico { width: 22px; height: 22px; }
.btn-volt {
  background: var(--grad-volt); color: var(--ink);
  font: 800 20px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: 0 6px 0 var(--volt-edge), 0 18px 40px -10px rgba(200, 255, 61, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.65);
}
.btn-volt.xl { height: 72px; font-size: 24px; border-radius: 22px; padding: 0 40px; }
.btn-ghost { background: transparent; box-shadow: none; color: var(--text-2); }
.icon-btn {
  width: 52px; height: 52px; border-radius: 16px; display: inline-grid; place-items: center;
  background: var(--surface-2); box-shadow: 0 4px 0 #0A0822, inset 0 0 0 1.5px var(--stroke-2); color: var(--text);
}
.icon-btn .ico { width: 24px; height: 24px; }

/* ---------- chips & pills ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-pill);
  font: 600 16px/1 var(--font-ui); color: var(--text-2); background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--stroke-2);
  white-space: nowrap;
}
.chip.on { background: var(--text); color: var(--ink); box-shadow: none; }
.chip .count { font: 700 13px/1 var(--font-ui); opacity: 0.6; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: var(--r-pill);
  background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--stroke); font: 700 17px/1 var(--font-ui);
}
.tag {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px;
  font: 700 12px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase;
}

/* ---------- cards ---------- */
.card {
  background: var(--grad-card), var(--surface-1); border-radius: var(--r-l);
  box-shadow: var(--sh-card), inset 0 0 0 1px var(--stroke);
  position: relative;
}

/* ---------- level coin (3D node) ---------- */
.coin {
  --c: var(--st-2);
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; position: relative;
  font: 800 22px/1 var(--font-display); color: var(--ink);
  background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.55), transparent 42%), var(--c);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 45%, #07061A), inset 0 -4px 0 rgba(0, 0, 0, 0.12);
}
.coin.locked {
  background: var(--surface-2); color: var(--text-3);
  box-shadow: 0 6px 0 #0A0822, inset 0 0 0 2px var(--stroke-2);
}

/* ---------- star ---------- */
.star { width: 18px; height: 18px; color: var(--gold); }
.star.off { color: rgba(177, 166, 255, 0.22); }

/* ---------- timing chips ---------- */
.tchip {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 10px; border-radius: 12px;
  font: 800 15px/1 var(--font-ui); letter-spacing: 0.02em; color: var(--ink); white-space: nowrap;
}
.tchip .ico { width: 18px; height: 18px; }
.tchip small { font: 600 15px/1 var(--font-ui); opacity: 0.78; }
.tchip.perfect { background: var(--grad-gold); box-shadow: var(--glow-gold); }
.tchip.great { background: var(--great); box-shadow: 0 0 22px rgba(61, 245, 176, 0.5); }
.tchip.early { background: var(--early); box-shadow: 0 0 22px rgba(164, 147, 255, 0.5); }
.tchip.late { background: var(--late); box-shadow: 0 0 22px rgba(255, 154, 61, 0.5); }
.tchip.miss { background: transparent; color: var(--miss); box-shadow: inset 0 0 0 2px var(--miss); }

/* ---------- toggles ---------- */
.seg {
  display: inline-flex; padding: 4px; border-radius: 16px; background: var(--ink-0); box-shadow: inset 0 0 0 1.5px var(--stroke);
}
.seg b {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 12px;
  font: 700 15px/1 var(--font-ui); color: var(--text-3);
}
.seg b.on { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--stroke-2), 0 3px 0 #07061A; }

/* ---------- progress ---------- */
.bar { height: 12px; border-radius: 99px; background: rgba(177, 166, 255, 0.14); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--grad-neon); box-shadow: 0 0 14px rgba(255, 63, 164, 0.6); }

/* ---------- motion (live in HTML; screenshots freeze a frame) ---------- */
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.55); opacity: 0; } }
@keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pop-in { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
<style>
  body { background: radial-gradient(900px 400px at 50% 110%, rgba(123, 92, 255, 0.28), transparent 70%), var(--bg-2); }

  /* ---------- HUD ---------- */
  .hud { position: absolute; left: 16px; right: 16px; top: 12px; height: 60px; display: flex; align-items: center; gap: 10px; }
  .hud .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .hud .title .coin { width: 46px; height: 46px; font-size: 18px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #07061A); }
  .hud .title b { font: 700 20px/1.1 var(--font-ui); display: block; white-space: nowrap; }
  .hud .title small { font: 500 14px/1.2 var(--font-ui); color: var(--text-3); white-space: nowrap; }
  .hud .sp { flex: 1; }
  .board { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 18px 0 20px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)), var(--ink-0); box-shadow: inset 0 0 0 1.5px var(--stroke-2); }
  .board .score .label { font-size: 11px; letter-spacing: .16em; }
  .board .score b { font: 800 27px/1 var(--font-display); font-variant-numeric: tabular-nums; display: block; margin-top: 3px; }
  .board .div { width: 1px; height: 34px; background: var(--stroke-2); }
  .combo { display: flex; align-items: center; gap: 10px; }
  .combo .mult { position: relative; width: 48px; height: 48px; }
  .combo .mult svg { position: absolute; inset: 0; width: 48px; height: 48px; transform: rotate(-90deg); }
  .combo .mult b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 17px/1 var(--font-display); color: var(--volt); text-shadow: 0 0 12px rgba(200,255,61,.7); }
  .combo .st { display: grid; gap: 3px; }
  .combo .st b { font: 800 20px/1 var(--font-display); display: flex; align-items: center; gap: 4px; }
  .combo .st b .ico { width: 20px; height: 20px; color: #FF7A3D; }
  .combo .st small { font: 700 11px/1 var(--font-ui); letter-spacing: .14em; color: var(--text-3); text-transform: uppercase; }
  .tempo { display: flex; align-items: center; height: 52px; border-radius: 16px; background: var(--surface-2); box-shadow: 0 4px 0 #0A0822, inset 0 0 0 1.5px var(--stroke-2); }
  .tempo span.step { width: 44px; height: 52px; display: grid; place-items: center; color: var(--text-2); }
  .tempo span.step .ico { width: 20px; height: 20px; }
  .tempo .bpm { font: 800 19px/1 var(--font-display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; min-width: 64px; justify-content: center; }
  .tempo .bpm .ico { width: 20px; height: 20px; color: var(--text-3); }
  .hud .seg b { height: 44px; }
  .hud .listen { height: 52px; padding: 0 16px; font-size: 16px; border-radius: 16px; box-shadow: 0 4px 0 #0A0822, inset 0 0 0 1.5px var(--stroke-2); }
  .hud .pause { width: 52px; height: 52px; }

  /* ---------- paper ---------- */
  .paper { position: absolute; left: 16px; right: 16px; top: 84px; height: 224px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, #FFFBF2, var(--paper) 40%, #FBF1DC); box-shadow: 0 20px 40px -18px rgba(0,0,0,.8), inset 0 -2px 0 rgba(160,130,80,.18); }
  .paper svg { position: absolute; left: -16px; top: -84px; width: 1180px; height: 820px; }

  /* ---------- status strip (mic · timing rail · progress) ---------- */
  .strip { position: absolute; left: 16px; right: 16px; top: 316px; height: 40px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .mic { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border-radius: 99px; background: rgba(7,6,26,.7); box-shadow: inset 0 0 0 1.5px var(--stroke); font: 700 13px/1 var(--font-ui); color: var(--text-2); width: 190px; }
  .mic .ico { width: 16px; height: 16px; color: var(--great); }
  .mic .lv { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
  .mic .lv i { width: 4px; border-radius: 2px; background: var(--great); }
  .rail { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 99px; background: rgba(7,6,26,.78); box-shadow: inset 0 0 0 1.5px var(--stroke-2); }
  .rail .end { font: 800 12px/1 var(--font-ui); letter-spacing: .12em; display: flex; align-items: center; gap: 4px; }
  .rail .end .ico { width: 13px; height: 13px; }
  .track { position: relative; width: 330px; height: 12px; border-radius: 99px;
    background: linear-gradient(90deg, rgba(164,147,255,.9) 0%, rgba(164,147,255,.25) 34%, rgba(255,210,63,.95) 44%, rgba(255,210,63,.95) 56%, rgba(255,154,61,.25) 66%, rgba(255,154,61,.9) 100%); }
  .track .zone { position: absolute; left: 44%; width: 12%; top: -5px; bottom: -5px; border-radius: 6px; box-shadow: 0 0 0 1.5px rgba(255,210,63,.8), 0 0 14px rgba(255,210,63,.5); }
  .track .tick { position: absolute; top: -4px; width: 3px; height: 20px; border-radius: 2px; background: #fff; transform: translateX(-50%); }
  .track .now { position: absolute; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(45deg); background: #fff; border-radius: 3px; box-shadow: 0 0 0 3px rgba(255,210,63,.6), 0 0 16px rgba(255,255,255,.9); }
  .track .avg { position: absolute; top: 20px; transform: translateX(-50%); font: 700 11px/1 var(--font-ui); color: var(--text-2); white-space: nowrap; }
  .prog { display: flex; align-items: center; gap: 10px; width: 190px; justify-content: flex-end; font: 700 13px/1 var(--font-ui); color: var(--text-2); }
  .prog .bar { width: 96px; height: 8px; }

  /* ---------- field + keyboard (svg) ---------- */
  #field { position: absolute; left: 0; top: 0; width: 1180px; height: 820px; }

  /* ---------- timing chips on the hit line ---------- */
  .fx { position: absolute; z-index: 4; transform: translate(-50%, 0); }
  .fx.fade { opacity: .5; }
</style>
</head>

const bars = [150, 400, 650, 900, 1150];
for (const x of bars.slice(1)) st += `<rect x="${x}" y="118" width="1.6" height="144" fill="${ink}"/>`;
st += `<rect x="1146" y="118" width="4" height="144" fill="${ink}" opacity=".0"/>`;
['2', '3', '4', '5'].forEach((n, i) => { st += `<text x="${bars[i] + 4}" y="106" font-family="Lexend" font-weight="600" font-size="13" fill="#7E7896">${n}</text>`; });
// notes: [bar, beat, name, dur, grade?]
const RH = [
  [0, 0, 'G4', 1, 'perfect'], [0, 1, 'F4', 1, 'great'], [0, 2, 'E4', 1, 'perfect'], [0, 3, 'D4', 1, 'great'],
  [1, 0, 'C4', 1, 'now'], [1, 1, 'C4', 1], [1, 2, 'D4', 1], [1, 3, 'E4', 1],
  [2, 0, 'E4', 1.5], [2, 1.5, 'D4', 0.5], [2, 2, 'D4', 2],
  [3, 0, 'E4', 1], [3, 1, 'E4', 1], [3, 2, 'F4', 1], [3, 3, 'G4', 1],
];
const LH = [
  [0, 0, 'B2', 2, 'perfect'], [0, 2, 'G2', 2, 'late'],
  [1, 0, 'C3', 2, 'now'], [1, 2, 'E3', 2],
  [2, 0, 'G2', 2], [2, 2, 'B2', 2],
  [3, 0, 'C3', 4],
];
const bx = (bar, beat) => bars[bar] + 26 + beat * 55;
const PLAY_X = bx(1, 0) + 7;
// playhead band (behind notes)
let under = `<defs><linearGradient id="ph" x1="0" x2="1"><stop offset="0" stop-color="#FF3FA4" stop-opacity="0"/><stop offset=".5" stop-color="#FF3FA4" stop-opacity=".22"/><stop offset="1" stop-color="#FF3FA4" stop-opacity="0"/></linearGradient></defs>`;
under += `<rect x="${PLAY_X - 26}" y="92" width="52" height="208" fill="url(#ph)"/>`;
under += `<rect x="${PLAY_X - 1.5}" y="96" width="3" height="200" rx="1.5" fill="#FF3FA4"/>`;
under += `<path d="M${PLAY_X - 8} 92h16l-8 9z" fill="#FF3FA4"/><path d="M${PLAY_X - 8} 300h16l-8 -9z" fill="#FF3FA4"/>`;
// played-region tint


function drawNote(bar, beat, name, dur, grade, staff) {
  const x = bx(bar, beat);
  const y = staff === 'T' ? yT(name) : yB(name);
  const col = grade && grade !== 'now' ? G[grade] : ink;
  let o = '';
  // ledger lines
  if (staff === 'T' && step(name) <= 28) o += `<rect x="${x - 5}" y="${yT('C4') - 0.8}" width="${1.18 * SP + 10}" height="1.6" fill="${ink}"/>`;
  if (grade === 'now') o += `<circle cx="${x + 7}" cy="${y}" r="15" fill="${staff === 'T' ? '#35D6FF' : '#FF5FB7'}" opacity=".35"/><circle cx="${x + 7}" cy="${y}" r="11" fill="none" stroke="${staff === 'T' ? '#0FA9D6' : '#E23C97'}" stroke-width="2.4"/>`;
  const head = dur >= 4 ? 'noteheadWhole' : dur >= 2 ? 'noteheadHalf' : 'noteheadBlack';
  o += glyph(head, x, y, col);
  const stemUp = staff === 'T' ? step(name) < 34 : step(name) < 22;
  if (dur < 4) {
    if (stemUp) o += `<rect x="${x + 1.18 * SP - 1.3}" y="${y - 3.4 * SP}" width="1.3" height="${3.4 * SP - 2}" fill="${col}"/>`;
    else o += `<rect x="${x}" y="${y + 2}" width="1.3" height="${3.4 * SP - 2}" fill="${col}"/>`;
  }
  if (dur === 0.5) o += glyph('flag8thUp', x + 1.18 * SP - 1.3, y - 3.4 * SP, col);
  if (dur === 1.5) o += glyph('augmentationDot', x + 1.18 * SP + 5, y - ((staff === 'T' ? step(name) - 30 : step(name) - 18) % 2 === 0 ? SP / 2 : 0), col);
  // finger number above first notes of bar 3 (upcoming)
  return o;
}
let notes = '';
RH.forEach(([b, t, n, d, g]) => notes += drawNote(b, t, n, d, g, 'T'));
LH.forEach(([b, t, n, d, g]) => notes += drawNote(b, t, n, d, g, 'B'));
// fingering (upcoming bar)
[['1', 1, 1, 'C4'], ['2', 1, 2, 'D4'], ['3', 1, 3, 'E4']].forEach(([f, b, t, n]) => {
  notes += `<text x="${bx(b, t) + 7}" y="${yT(n) + 26}" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="12" fill="#7E7896">${f}</text>`;
});
document.getElementById('staff').innerHTML = under + st + notes;

/* ============ FIELD + KEYBOARD ============ */
const whites = ['F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5'];
const KW = 1148 / whites.length, X0 = 16;
const keyX = {};
whites.forEach((n, i) => keyX[n] = X0 + (i + 0.5) * KW);
const blackAfter = ['F2','G2','A2','C3','D3','F3','G3','A3','C4','D4','F4','G4','A4','C5'];
const blacks = blackAfter.map((n) => ({ name: n[0] + '#' + n.slice(1), x: keyX[n] + KW / 2 }));
blacks.forEach((b) => keyX[b.name] = b.x);

const FIELD_TOP = 356, HIT = 634, KB_TOP = 640, KB_BOT = 806, PPB = 64;
let f = '';
f += `<defs>
  <linearGradient id="rhBar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7BE6FF"/><stop offset="1" stop-color="#18B8F0"/></linearGradient>
  <linearGradient id="lhBar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF9AD2"/><stop offset="1" stop-color="#F0409E"/></linearGradient>
  <linearGradient id="wk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".85" stop-color="#F1EEF8"/><stop offset="1" stop-color="#D9D3EA"/></linearGradient>
  <linearGradient id="bk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2C2766"/><stop offset="1" stop-color="#110E33"/></linearGradient>
  <linearGradient id="wkR" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9BEEFF"/><stop offset="1" stop-color="#35D6FF"/></linearGradient>
  <linearGradient id="wkL" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFB3DD"/><stop offset="1" stop-color="#FF5FB7"/></linearGradient>
  <linearGradient id="hitl" x1="0" x2="1"><stop offset="0" stop-color="#7B5CFF"/><stop offset=".5" stop-color="#FF3FA4"/><stop offset="1" stop-color="#FF9A3D"/></linearGradient>
  <radialGradient id="burst"><stop offset="0" stop-color="#FFF6C8" stop-opacity=".95"/><stop offset=".35" stop-color="#FFD23F" stop-opacity=".55"/><stop offset="1" stop-color="#FFD23F" stop-opacity="0"/></radialGradient>
  <radialGradient id="burstL"><stop offset="0" stop-color="#FFE0F2" stop-opacity=".9"/><stop offset=".35" stop-color="#A493FF" stop-opacity=".45"/><stop offset="1" stop-color="#A493FF" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="fieldClip"><rect x="16" y="${FIELD_TOP}" width="1148" height="${HIT - FIELD_TOP}"/></clipPath>
</defs>`;
// field background
f += `<rect x="16" y="${FIELD_TOP - 40}" width="1148" height="${HIT - FIELD_TOP + 40}" rx="0" fill="url(#fieldBg)" opacity="0"/>`;
f += `<g clip-path="url(#fieldClip)">`;
// black-key lanes shading
blacks.forEach((b) => f += `<rect x="${b.x - KW * 0.3}" y="${FIELD_TOP}" width="${KW * 0.6}" height="${HIT - FIELD_TOP}" fill="#07061A" opacity=".35"/>`);
// octave guides (at every C) + lane edges
whites.forEach((n, i) => {
  const x = X0 + i * KW;
  f += `<rect x="${x - 0.5}" y="${FIELD_TOP}" width="1" height="${HIT - FIELD_TOP}" fill="${n[0] === 'C' ? 'rgba(177,166,255,.28)' : 'rgba(177,166,255,.07)'}"/>`;
});
// beat lines (now = bar 3 beat 1)
for (let k = 0; k <= 5; k++) {
  const y = HIT - k * PPB;
  const barLine = k % 4 === 0;
  f += `<rect x="16" y="${y - 0.5}" width="1148" height="${barLine ? 1.5 : 1}" fill="rgba(177,166,255,${barLine ? .22 : .08})"/>`;
  if (barLine && k > 0) f += `<text x="26" y="${y - 6}" font-family="Lexend" font-weight="700" font-size="12" fill="rgba(177,166,255,.5)">${3 + k / 4}</text>`;
}
// falling notes: [name, onsetBeat (0 = now), dur, hand, finger]
const falling = [
  ['C4', 0, 1, 'R', 1, 'hit'], ['C4', 1, 1, 'R', 1], ['D4', 2, 1, 'R', 2], ['E4', 3, 1, 'R', 3], ['E4', 4, 1.5, 'R', 3],
  ['C3', 0, 2, 'L', 5, 'hit'], ['E3', 2, 2, 'L', 3], ['G2', 4, 2, 'L', 5],
];
for (const [n, on, d, h, fg, st2] of falling) {
  const cx = keyX[n], w = n.includes('#') ? KW * 0.5 : KW * 0.7;
  let top = HIT - (on + d) * PPB + 3, bot = HIT - on * PPB - 3;
  if (st2 === 'hit') bot = HIT;
  const fill = h === 'R' ? 'url(#rhBar)' : 'url(#lhBar)';
  const glowc = h === 'R' ? 'rgba(53,214,255,.55)' : 'rgba(255,95,183,.55)';
  f += `<rect x="${cx - w / 2}" y="${top}" width="${w}" height="${bot - top}" rx="10" fill="${fill}" ${st2 === 'hit' ? 'filter="url(#glow)"' : ''} style="filter:drop-shadow(0 0 10px ${glowc})"/>`;
  f += `<rect x="${cx - w / 2 + 5}" y="${top + 4}" width="${w - 10}" height="5" rx="2.5" fill="#fff" opacity=".45"/>`;
  if (st2 === 'hit') f += `<rect x="${cx - w / 2}" y="${top}" width="${w}" height="${bot - top}" rx="10" fill="none" stroke="#FFF6C8" stroke-width="3"/>`;
  // finger number badge
  const by = Math.min(bot - 17, HIT - 17);
  if (bot - top > 30) f += `<circle cx="${cx}" cy="${by}" r="11" fill="rgba(7,6,26,.55)"/><text x="${cx}" y="${by + 4.5}" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="13" fill="#fff">${fg}</text>`;
}
f += `</g>`;
// hit bursts
f += `<ellipse cx="${keyX.C4}" cy="${HIT}" rx="70" ry="40" fill="url(#burst)"/>`;
f += `<ellipse cx="${keyX.C3}" cy="${HIT}" rx="60" ry="32" fill="url(#burstL)"/>`;
// sparks
const spark = (x, y, r, c, rot = 0) => `<path d="M${x} ${y - r}c${r * .18} ${r * .62} ${r * .38} ${r * .82} ${r} ${r}c-${r * .62} ${r * .18}-${r * .82} ${r * .38}-${r} ${r}c-${r * .18}-${r * .62}-${r * .38}-${r * .82}-${r}-${r}c${r * .62}-${r * .18} ${r * .82}-${r * .38} ${r}-${r}z" fill="${c}" transform="rotate(${rot} ${x} ${y})"/>`;
[[-44, -34, 7], [38, -46, 9], [58, -14, 5], [-60, -8, 5], [10, -62, 6], [-22, -58, 4]].forEach(([dx, dy, r], i) => f += spark(keyX.C4 + dx, HIT + dy, r, i % 2 ? '#FFE98A' : '#FFFFFF', i * 20));
[[-40, -26, 5], [34, -30, 6], [-8, -44, 4]].forEach(([dx, dy, r], i) => f += spark(keyX.C3 + dx, HIT + dy, r, i % 2 ? '#D9CFFF' : '#FFFFFF'));
// hit line
f += `<rect x="16" y="${HIT - 5}" width="1148" height="10" fill="url(#hitl)" opacity=".28" rx="5"/>`;
f += `<rect x="16" y="${HIT - 1.5}" width="1148" height="3" fill="url(#hitl)" rx="1.5"/>`;
// keyboard well
f += `<rect x="12" y="${KB_TOP - 4}" width="1156" height="${KB_BOT - KB_TOP + 10}" rx="12" fill="#07061A"/>`;
whites.forEach((n, i) => {
  const x = X0 + i * KW + 1;
  const pressed = n === 'C4' ? 'wkR' : n === 'C3' ? 'wkL' : null;
  f += `<path d="M${x} ${KB_TOP}h${KW - 2}v${KB_BOT - KB_TOP - 8}a8 8 0 0 1-8 8h${-(KW - 18)}a8 8 0 0 1-8-8z" fill="url(#${pressed || 'wk'})" ${pressed ? `style="filter:drop-shadow(0 0 14px ${n === 'C4' ? 'rgba(53,214,255,.9)' : 'rgba(255,95,183,.9)'})"` : ''}/>`;
  if (n[0] === 'C') f += `<text x="${X0 + (i + 0.5) * KW}" y="${KB_BOT - 12}" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="13" fill="${pressed ? '#07061A' : '#8F89B8'}">${n}</text>`;
});
// hint dots on the next keys (D4 rh, E3 lh)
f += `<circle cx="${keyX.D4}" cy="${KB_BOT - 36}" r="7" fill="#35D6FF" style="filter:drop-shadow(0 0 6px rgba(53,214,255,.8))"/>`;
blacks.forEach((b) => {
  f += `<rect x="${b.x - KW * 0.31}" y="${KB_TOP}" width="${KW * 0.62}" height="${(KB_BOT - KB_TOP) * 0.6}" rx="6" fill="url(#bk)"/>`;
  f += `<rect x="${b.x - KW * 0.31 + 4}" y="${KB_TOP + (KB_BOT - KB_TOP) * 0.6 - 12}" width="${KW * 0.62 - 8}" height="7" rx="3" fill="#3C3680"/>`;
});
f += `<rect x="12" y="${KB_TOP - 4}" width="1156" height="6" fill="#07061A"/>`;
document.getElementById('field').innerHTML = f;

// place chips on their lanes
const place = (id, x, y) => { const el = document.getElementById(id); el.style.left = x + 'px'; el.style.top = y + 'px'; };
place('chip-perfect', keyX.C4, HIT - 54);
place('chip-early', keyX.C3, HIT - 50);
document.getElementById('chip-great').style.left = (keyX.D4 - 16) + 'px';
document.getElementById('chip-great').style.top = (HIT - 104) + 'px';
</script>
</body>
</html>
