<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro Concert Mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F0C0A; --card: #1B1612; --line: rgba(245,238,223,.1); --text: #F5EEDF; --muted: #B3A892; --gold: #E9C77F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(900px 500px at 50% -10%, rgba(240,200,130,.14), transparent 70%), var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font: 560 44px/1.05 Fraunces, Georgia, serif; margin: 0; }
  p.lede { color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; margin-top: 28px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--line); }
  figcaption { padding: 12px 16px 14px; display: flex; justify-content: space-between; gap: 12px; font-weight: 650; }
  figcaption a { color: var(--gold); text-decoration: none; font-weight: 700; }
  .eyebrow { font: 700 12px/1 Manrope, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Maestro · brand direction</div>
  <h1>Concert</h1>
  <p class="lede">An evening at the concert hall: a warm dark stage, one gold spotlight per screen, music printed on cream paper, Fraunces and Manrope, and a fermata for a mark. The full spec is in <code>spec.md</code>. Each mockup is 1180×820 (iPad landscape).</p>
  <div class="grid">
    <figure><img src="home.png" alt="Home"><figcaption>Home and learning path <a href="home.html">HTML</a></figcaption></figure>
    <figure><img src="placement-1-experience.png" alt="Placement: experience question"><figcaption>Placement 1: experience <a href="placement-1-experience.html">HTML</a></figcaption></figure>
    <figure><img src="placement-2-test.png" alt="Placement: test"><figcaption>Placement 2: test 3 of ~7 <a href="placement-2-test.html">HTML</a></figcaption></figure>
    <figure><img src="placement-3-reveal.png" alt="Placement: level reveal"><figcaption>Placement 3: level reveal <a href="placement-3-reveal.html">HTML</a></figcaption></figure>
    <figure><img src="play.png" alt="Play screen"><figcaption>Play screen <a href="play.html">HTML</a></figcaption></figure>
    <figure><img src="results.png" alt="Results"><figcaption>Results <a href="results.html">HTML</a></figcaption></figure>
    <figure><img src="songs.png" alt="Song library"><figcaption>Song library <a href="songs.html">HTML</a></figcaption></figure>
    <figure><img src="brand.png" alt="Brand sheet"><figcaption>Brand sheet <a href="brand.html">HTML</a></figcaption></figure>
  </div>
</main>
</body>
</html>
